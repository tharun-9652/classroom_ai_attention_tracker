[project]
name = "classfocus-attention-monitor"
version = "0.2.0"
# Pin the production Vercel runtime. MediaPipe 0.10.21 supplies a compatible
# FaceMesh wheel for CPython 3.12 while newer releases removed this API.
requires-python = "~=3.12.0"
dependencies = [
  "Django==5.2.18",
  "dj-database-url==2.3.0",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "qrcode==7.4.2",
  "whitenoise==6.12.0",
  "numpy==1.26.4",
  # 0.10.35 removed the legacy `mp.solutions` API used by this application.
  # 0.10.21 retains FaceMesh and publishes a CPython 3.12 runtime wheel.
  "mediapipe==0.10.21",
  "Pillow==11.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classfocus*", "monitoring*"]

[tool.vercel]
entrypoint = "api.index:app"

# Runs during Vercel builds after production environment variables are loaded.
# bootstrap_admin creates an account only when absent; it never overwrites an
# existing administrator password.
[tool.vercel.scripts]
build = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py bootstrap_admin"

